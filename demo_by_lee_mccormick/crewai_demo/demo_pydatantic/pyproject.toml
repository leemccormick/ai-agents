[project]
name = "demo_pydatantic"
version = "0.1.0"
description = "demo_pydatantic using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.148.0,<1.0.0"
]

[project.scripts]
demo_pydatantic = "demo_pydatantic.main:run"
run_crew = "demo_pydatantic.main:run"
train = "demo_pydatantic.main:train"
replay = "demo_pydatantic.main:replay"
test = "demo_pydatantic.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
