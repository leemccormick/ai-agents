[project]
name = "uscis"
version = "0.1.0"
description = "uscis using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=0.148.0,<1.0.0"
]

[project.scripts]
uscis = "uscis.main:run"
run_crew = "uscis.main:run"
train = "uscis.main:train"
replay = "uscis.main:replay"
test = "uscis.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
